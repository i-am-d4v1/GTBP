<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Goorilla</title>
    <meta name="description" content="Tag in the browser">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-canvas-container">
        <canvas id="unity-canvas" style="width: 100%; height: 100%;"></canvas>
      </div>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <button id="entervr" value="Enter VR" disabled>VR</button>
        <button id="enterar" value="Enter AR" disabled>AR</button>
        <div id="unity-webxr-link">Using <a href="https://github.com/De-Panther/unity-webxr-export" target="_blank" title="WebXR Export">WebXR Export</a></div>
        <div id="unity-build-title">Goorilla</div>
      </div>
      <div id="unity-xr-status" style="display:none;max-width:960px;margin:0 auto;padding:4px 8px;font:12px/1.4 sans-serif;color:#555;text-align:center;word-wrap:break-word;"></div>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderName = "WebGL.loader.js";

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var canvasContainer = document.querySelector("#unity-canvas-container");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var unityInstance = null;

      canvasContainer.style.width = "960px";
      canvasContainer.style.height = "600px";
      loadingBar.style.display = "block";

      var enterARButton = document.getElementById("enterar");
      var enterVRButton = document.getElementById("entervr");

      document.addEventListener("onARSupportedCheck", function (event) {
        enterARButton.disabled = !event.detail.supported;
      }, false);

      document.addEventListener("onVRSupportedCheck", function (event) {
        enterVRButton.disabled = !event.detail.supported;
      }, false);

      // The package announces support after Unity initialises; this probe makes sure the
      // buttons come alive even if that event has already fired or never arrives.
      function probeSupport() {
        if (!unityInstance) return;
        if (!navigator.xr || !navigator.xr.isSessionSupported) return;
        navigator.xr.isSessionSupported("immersive-ar").then(function (ok) {
          enterARButton.disabled = !ok;
        }).catch(function () {});
        navigator.xr.isSessionSupported("immersive-vr").then(function (ok) {
          enterVRButton.disabled = !ok;
        }).catch(function () {});
      }
      probeSupport();

      // Entering a session can fail on a headset in ways that are invisible once the
      // browser covers the page, so the reason is written under the canvas.
      var xrStatusElement = document.getElementById("unity-xr-status");

      function showXRStatus(message) {
        if (!xrStatusElement) return;
        xrStatusElement.textContent = message;
        xrStatusElement.style.display = message ? "block" : "none";
      }

      document.addEventListener("onXRStatus", function (event) {
        showXRStatus(event.detail.message);
      }, false);

      window.addEventListener("unhandledrejection", function (event) {
        var reason = event && event.reason;
        if (!reason) return;
        showXRStatus("XR failed: " + (reason.name ? reason.name + ": " + reason.message : String(reason)));
      });

      window.addEventListener("error", function (event) {
        if (event && event.message) showXRStatus("XR failed: " + event.message);
      });

      // Confirms the session really started rendering, or reports why it did not.
      function watchSessionStart() {
        var started = Date.now();
        var timer = setInterval(function () {
          var status = null;
          try { status = unityInstance.Module.WebXR.getXRStatus(); } catch (e) {}
          var running = status && status.inSession && status.framesStarted;
          if (running) {
            clearInterval(timer);
            showXRStatus("");
            return;
          }
          if (Date.now() - started > 12000) {
            clearInterval(timer);
            showXRStatus(status && status.lastStatus ? status.lastStatus : "VR did not start");
          }
        }, 250);
      }

      function enterAR() {
        if (!unityInstance) { showXRStatus("Still loading"); return; }
        showXRStatus("Starting AR...");
        try { unityInstance.Module.WebXR.toggleAR(); } catch (e) { showXRStatus("AR failed: " + e); return; }
        watchSessionStart();
      }

      function enterVR() {
        if (!unityInstance) { showXRStatus("Still loading"); return; }
        showXRStatus("Starting VR...");
        try { unityInstance.Module.WebXR.toggleVR(); } catch (e) { showXRStatus("VR failed: " + e); return; }
        watchSessionStart();
      }

      enterARButton.addEventListener("click", enterAR, false);
      enterVRButton.addEventListener("click", enterVR, false);

      // A fresh stamp on every build means no stale cached runtime: the loader, wasm,
      // framework and data URLs all change together, so the plain URL is always current.
      function loadVersion() {
        return fetch("version.json?t=" + Date.now(), { cache: "no-store" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; });
      }

      loadVersion().then(function (info) {
        var q = info && info.v ? "?v=" + encodeURIComponent(info.v) : "";

        var config = {
          dataUrl: buildUrl + "/WebGL.data.unityweb" + q,
          frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb" + q,
          codeUrl: buildUrl + "/WebGL.wasm.unityweb" + q,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "D4V1 Creations",
          productName: "Tag",
          productVersion: "1.1.10"
        };

        var script = document.createElement("script");
        script.src = buildUrl + "/" + loaderName + q;

        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            progressBarFull.style.width = 100 * progress + "%";
          }).then(function (instance) {
            unityInstance = instance;
            loadingBar.style.display = "none";
            if (fullscreenButton) {
              fullscreenButton.onclick = function () {
                unityInstance.SetFullscreen(1);
              };
            }
            probeSupport();
          }).catch(function (message) {
            alert(message);
          });
        };

        document.body.appendChild(script);
      });
    </script>
  </body>
</html>
